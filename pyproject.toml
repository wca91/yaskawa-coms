[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yaskawa-coms"
version = "0.1.0"
description = "Talk to Yaskawa MP-series and CP-series controllers over Ethernet: Extended MEMOBUS, Modbus/TCP and non-procedure communication."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "Wong Cheng An", email = "wca1991@gmail.com" }]
keywords = ["yaskawa", "memobus", "modbus", "modbus-tcp", "plc", "mp2000", "mp3000", "218if", "218txb", "cp-317", "industrial", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wca91/yaskawa-coms"
Repository = "https://github.com/wca91/yaskawa-coms"
Issues = "https://github.com/wca91/yaskawa-coms/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
yaskawa-coms = "yaskawa_coms.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yaskawa_coms"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
